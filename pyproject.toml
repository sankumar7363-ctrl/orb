[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orb"
version = "0.2.0"
description = "ORB Platform - AI Operating Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["python-docx>=1.2.0"]
license = { text = "Proprietary" }
authors = [
    { name = "Santosh Kumar" }
]

[project.scripts]
orb = "orb.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
voice = [
    "numpy>=2.0",
    "scipy>=1.12",
    "sounddevice>=0.5.6",
    "soundfile>=0.13",
    "piper-tts>=1.8.0",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.31.1",
    "onnx-asr>=0.12.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
